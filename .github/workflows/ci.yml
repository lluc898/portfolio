name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build production site
        run: npm run build

      - name: Validate HTML and accessibility
        run: npm run check:a11y

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test recruiter journeys
        run: npm run test:e2e

      - name: Enforce Lighthouse budgets
        run: npm run check:lighthouse

      - name: Validate Vercel Analytics integration
        run: npm run check:analytics

      - name: Validate SEO metadata
        run: npm run check:seo

      - name: Validate links and CTAs
        run: npm run check:links
