name: Discover server SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, portfolio]
    timeout-minutes: 5
    steps:
      - name: Report SSH endpoint without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'hostname='; hostname
          printf 'addresses='; hostname -I
          echo 'routes:'
          ip -4 route
          echo 'ssh-listeners:'
          ss -ltn | awk 'NR == 1 || $4 ~ /:22$|:2222$|:2200$|:22222$/'
          echo 'ssh-service:'
          systemctl is-active ssh 2>/dev/null || systemctl is-active sshd 2>/dev/null || true
          echo 'configured-ports:'
          grep -hE '^[[:space:]]*(Port|ListenAddress)[[:space:]]+' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
