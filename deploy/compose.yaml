services:
  portfolio:
    image: nginx:stable-alpine
    container_name: llucbosch-portfolio
    restart: unless-stopped
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./site-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
