server {
    listen 80;
    listen [::]:80;
    server_name llucbosch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
    }

    location / {
        return 301 https://llucbosch.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name llucbosch.com;

    ssl_certificate /etc/letsencrypt/live/llucbosch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llucbosch.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:llucbosch_ssl:10m;
    ssl_session_timeout 1d;

    access_log /data/logs/llucbosch_access.log proxy;
    error_log /data/logs/llucbosch_error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass http://llucbosch-portfolio:80;
    }
}
